resource:
    name: ShoppingListItems
    shortName: shopping-list-items

    properties:
        productConfigurationInstance:
            type: mixed
            writable: true
            readable: true
            description: 'Product configuration instance data'
            openapiContext:
                example:
                    displayData: '{"some_key":"some_value"}'
                    configuration: '{"some_key":"some_value"}'
                    configuratorKey: 'DATE_TIME_CONFIGURATOR'
                    isComplete: true
                    availableQuantity: 5
                    prices:
                        - priceTypeName: 'DEFAULT'
                          netAmount: 10000
                          grossAmount: 12000
                          currency:
                              code: 'EUR'
                              name: 'Euro'
                              symbol: '€'
